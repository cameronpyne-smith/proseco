version = 1
revision = 3
requires-python = ">=3.12"

[options]
exclude-newer = "2026-01-01T00:00:00Z"

[[package]]
name = "acme-api"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "acme-client" },
    { name = "acme-yaml", marker = "sys_platform == 'linux'" },
]

[package.dev-dependencies]
dev = [
    { name = "acme-pytest" },
]

[package.metadata]
requires-dist = [
    { name = "acme-client", specifier = ">=1.0" },
    { name = "acme-yaml", specifier = ">=6" },
]

[package.metadata.requires-dev]
dev = [{ name = "acme-pytest", specifier = ">=8" }]

[[package]]
name = "acme-client"
version = "1.5.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "acme-urllib" },
]
sdist = { url = "https://files.example.invalid/acme-client-1.5.0.tar.gz", hash = "sha256:00", size = 100 }
wheels = [
    { url = "https://files.example.invalid/acme_client-1.5.0-py3-none-any.whl", hash = "sha256:01", size = 90 },
]

[[package]]
name = "acme-urllib"
version = "2.0.1"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.example.invalid/acme-urllib-2.0.1.tar.gz", hash = "sha256:02", size = 50 }

[[package]]
name = "acme-yaml"
version = "6.0.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "acme-pytest"
version = "8.0.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "acme-urllib" },
]

[package.optional-dependencies]
extra = [
    { name = "acme-yaml" },
]
