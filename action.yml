name: proseco
description: Keep one GitHub issue per repository listing its critical and high vulnerabilities that have a fix

inputs:
  config:
    description: Path to the proseco config file, relative to the workspace
    required: true
  private-key:
    description: The proseco GitHub App's private key; the config's app section names the app and its installation
    required: true
  azure-subscription-id:
    description: Subscription to read Defender findings from; required when the config enables the defender source, after azure/login
    required: false
    default: ""
  dry-run:
    description: Print the plan and write nothing
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    - name: Raise findings as tickets
      shell: bash
      env:
        PROSECO_CONFIG: ${{ inputs.config }}
        PROSECO_PRIVATE_KEY: ${{ inputs.private-key }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
        PROSECO_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        PROSECO_APP_KEY="$(mktemp "$RUNNER_TEMP/proseco-key.XXXXXX")"
        export PROSECO_APP_KEY
        trap 'rm -f "$PROSECO_APP_KEY"' EXIT
        printf '%s\n' "$PROSECO_PRIVATE_KEY" > "$PROSECO_APP_KEY"
        unset PROSECO_PRIVATE_KEY
        node "$GITHUB_ACTION_PATH/src/ticketer/main.ts"
